<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr Wellness - Choose Your Language</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f7f7f7;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            color: #333;
            font-size: 1.8em;
            font-weight: 400;
            margin-bottom: 5px;
        }

        .header p {
            color: #666;
            font-size: 1.8em;
            font-weight: 400;
        }

        .language-container {
            display: flex;
            gap: 60px;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }

        .language-card {
            position: relative;
            width: 300px;
            height: 350px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .language-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.15);
        }

        .logo-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            transition: opacity 0.3s ease;
        }

        .logo-container img {
            max-width: 100%;
            height: auto;
            object-fit: contain;
        }

        /* English logo - slightly smaller */
        .english-logo {
            width: 484px;
        }

        /* Spanish logo - same size as English */        .spanish-logo {
        width: 484px;       }
        .logo-label {
            margin-top: 20px;
            font-size: 1.4em;
            font-weight: 600;
            color: #333;
        }

        .buttons-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            padding: 30px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .language-card:hover .logo-container {
            opacity: 0;
        }

        .language-card:hover .buttons-container {
            opacity: 1;
            pointer-events: all;
        }

        .option-button {
            width: 100%;
            padding: 20px;
            text-align: center;
            text-decoration: none;
            color: white;
            font-size: 1.1em;
            font-weight: 600;
            border-radius: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .coaching-btn {
            background: linear-gradient(135deg, #8BC34A 0%, #7CB342 100%);
        }

        .education-btn {
            background: linear-gradient(135deg, #FF9800 0%, #F57C00 100%);
        }

        .option-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }

            .header p {
                font-size: 1.5em;
            }

            .language-container {
                gap: 30px;
            }

            .language-card {
                width: 280px;
                height: 320px;
            }

            .english-logo {
                width: 180px;
            }

            .spanish-logo {
                width: 220px;
            }

            .option-button {
                padding: 15px;
                font-size: 1em;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Choose Your Language</h1>
        <p>Escoge tu idioma</p>
    </div>

    <div class="language-container">
        <!-- English Card -->
        <div class="language-card">
            <div class="logo-container">
                <img src="Mr. Wellness Integral Health-01.png" alt="Mr Wellness - Integral Health" class="english-logo">
                <div class="logo-label">English</div>
            </div>
            <div class="buttons-container">
                <a href="english-coaching.html" class="option-button coaching-btn">Looking for Professional Coaching?</a>
                <a href="english-education.html" class="option-button education-btn">Looking for Education?</a>
            </div>
        </div>

        <!-- Spanish Card -->
        <div class="language-card">
            <div class="logo-container">
                <img src="Mr. Wellness Esp.png" alt="Mr Wellness - Salud Integral" class="spanish-logo">
                <div class="logo-label">Español</div>
            </div>
            <div class="buttons-container">
                <a href="spanish-coaching.html" class="option-button coaching-btn">¿Buscando Entrenamiento Profesional?</a>
                <a href="spanish-education.html" class="option-button education-btn">¿Buscando Educación Profesional?</a>
            </div>
        </div>
    </div>
</body>
</html>
