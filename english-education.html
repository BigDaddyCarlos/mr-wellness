<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr Wellness - Education</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f7f7f7;
            min-height: 100vh;
            padding: 20px;
        }

        .back-link {
            display: inline-block;
            margin: 20px 0;
            color: #ff9933;
            text-decoration: none;
            font-size: 1em;
        }

        .back-link:hover {
            text-decoration: underline;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 60px 40px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
        }

        .construction-icon {
            font-size: 120px;
            margin-bottom: 30px;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 20px;
            line-height: 1.3;
        }

        p {
            color: #666;
            font-size: 1.3em;
            margin-bottom: 40px;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #ff9933;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }
            
            h1 {
                font-size: 1.8em;
            }
            
            p {
                font-size: 1.1em;
            }
            
            .construction-icon {
                font-size: 80px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to language selection</a>
    
    <div class="container">
        <div class="construction-icon">🏗️</div>
        <h1>Brewing up the knowledge to help others</h1>
        <p>Please wait to meet my academic offer</p>
        <div class="spinner"></div>
    </div>
</body>
</html>
